[package]
name = "parking_lot_core-napi"
version = "0.9.13"
authors = ["Amanieu d'Antras <amanieu@gmail.com>"]
description = "An advanced API for creating custom synchronization primitives. Fork of parking_lot_core with a stable thread parker for threaded WASI targets."
license = "MIT OR Apache-2.0"
repository = "https://github.com/napi-rs/parking_lot"
keywords = ["mutex", "condvar", "rwlock", "once", "thread"]
categories = ["concurrency"]
edition = "2021"
rust-version = "1.71.0"

[lib]
name = "parking_lot_core"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
cfg-if = "1.0.0"
smallvec = "1.6.1"
petgraph = { version = "0.6.0", optional = true }
backtrace = { version = "0.3.60", optional = true }

[target.'cfg(target_os = "aix")'.dependencies]
libc = "0.2.181"

[target.'cfg(all(unix, not(target_os = "aix")))'.dependencies]
libc = "0.2.95"

[target.'cfg(target_os = "redox")'.dependencies]
redox_syscall = "0.5"

[target.'cfg(windows)'.dependencies]
windows-link = "0.2.0"

[features]
nightly = []
deadlock_detection = ["petgraph", "backtrace"]

name: Publish

# Publishes all three crates (lock_api-napi, parking_lot_core-napi,
# parking_lot-napi) in dependency order using crates.io Trusted Publishing
# (OIDC). No secrets are stored in this repository: crates-io-auth-action
# exchanges the GitHub OIDC token for a short-lived crates.io token.
#
# Each crate needs a GitHub trusted-publishing config on crates.io
# (crate Settings → Trusted Publishing → Add → GitHub) with:
#   repository owner: napi-rs
#   repository name:  parking_lot
#   workflow file:    publish.yml
# Trusted-publishing configs can only be added to crates that already exist,
# so the first publish of each crate must be done once by hand:
#   cargo publish -p lock_api-napi
#   cargo publish -p parking_lot_core-napi
#   cargo publish -p parking_lot-napi
#
# Afterwards, trigger this workflow by pushing a `v*` tag or manually.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # crates.io needs a short window to index each crate before dependents
      # can resolve it.
      - name: Publish lock_api-napi
        run: cargo publish -p lock_api-napi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for index
        run: sleep 30

      - name: Publish parking_lot_core-napi
        run: cargo publish -p parking_lot_core-napi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for index
        run: sleep 30

      - name: Publish parking_lot-napi
        run: cargo publish -p parking_lot-napi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

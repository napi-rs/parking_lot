name: Publish

# Publishes all three crates (lock_api-napi, parking_lot_core-napi,
# parking_lot-napi) in dependency order using crates.io Trusted Publishing
# (OIDC) — no long-lived token needed once each crate has a GitHub
# trusted-publishing config pointing at this workflow.
#
# Bootstrap: crates.io only allows configuring trusted publishing on crates
# that already exist. For the first publish only, either set a
# CARGO_REGISTRY_TOKEN repository secret (a scoped publish token — the OIDC
# step is skipped automatically when the secret exists) or publish once
# locally with `cargo publish`, then add the trusted-publishing configs on
# crates.io and remove the secret.
#
# Trigger by pushing a `v*` tag (the crates release in lockstep) or manually.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (OIDC)
        if: ${{ env.CRATES_IO_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # crates.io needs a short window to index each crate before dependents
      # can resolve it.
      - name: Publish lock_api-napi
        run: cargo publish -p lock_api-napi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CRATES_IO_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish parking_lot_core-napi
        run: cargo publish -p parking_lot_core-napi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CRATES_IO_TOKEN }}

      - name: Wait for index
        run: sleep 30

      - name: Publish parking_lot-napi
        run: cargo publish -p parking_lot-napi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CRATES_IO_TOKEN }}
